<!DOCTYPE html>
<html lang="he" dir="rtl" translate="no">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="google" content="notranslate"/>
<title>Zentro Builder — Design Exploration (Phase 0.5)</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#05080c;color:#e6edf6;font-family:"Heebo","Assistant",system-ui,Arial,sans-serif;padding:22px}
  .pgh{font-size:22px;font-weight:800;margin:0 0 2px}
  .pgs{color:#5c7086;font-size:13px;margin:0 0 22px}
  .concept{margin:0 0 34px}
  .clabel{display:flex;align-items:baseline;gap:10px;margin:0 0 8px}
  .clabel .k{font-size:16px;font-weight:800}
  .clabel .insp{font-size:12px;color:#7c8aa0}
  .clabel .swatches{margin-inline-start:auto;display:flex;gap:5px}
  .clabel .swatches i{width:16px;height:16px;border-radius:3px;display:block;border:1px solid rgba(255,255,255,.12)}
  .ws{border-radius:10px;overflow:hidden;border:1px solid #1e2a38;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  .tb{display:flex;align-items:center;gap:8px;height:46px;padding:0 12px;font-size:12px;font-weight:600}
  .tb .g{display:flex;align-items:center;gap:4px}
  .tb .sep{width:1px;height:24px;opacity:.5}
  .tb .b{padding:6px 10px;border-radius:6px;cursor:default;white-space:nowrap}
  .tb .b.on{font-weight:800}
  .tb .ttl{margin-inline-start:auto;font-weight:800;letter-spacing:.03em}
  .row{display:grid;grid-template-columns:230px 1fr 270px;height:430px}
  .pane{display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .ph{height:30px;display:flex;align-items:center;padding:0 10px;font-size:10px;font-weight:800;letter-spacing:.1em;opacity:.85}
  .pp{flex:1;overflow:auto;padding:10px}
  .srch{font-size:11px;border-radius:6px;padding:7px 9px;margin-bottom:10px;opacity:.9}
  .cats{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px;font-size:10px}
  .cats span{padding:3px 8px;border-radius:999px}
  .libcards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .lc{border-radius:6px;padding:9px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10px;font-weight:600}
  .canvas{position:relative;overflow:hidden}
  .zc{position:absolute;inset-inline-start:10px;bottom:10px;display:flex;flex-direction:column;border-radius:6px;overflow:hidden;font-size:13px}
  .zc b{width:26px;height:24px;display:flex;align-items:center;justify-content:center;cursor:default}
  .insp .hero{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px}
  .insp .nm{font-size:16px;font-weight:800}
  .insp .ty{font-size:11px;font-weight:700}
  .insp .acts{display:flex;gap:8px;width:100%}
  .insp .acts button{flex:1;height:30px;border-radius:6px;font-size:11px;font-weight:700;border:1px solid;background:transparent;cursor:default}
  .insp .sec{padding:10px 12px;font-size:11px}
  .insp .pr{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:5px;margin-bottom:4px}
  .insp .pr i{width:9px;height:9px;border-radius:2px}
  .insp .pr .pl{margin-inline-start:auto;font-size:9px;font-weight:800;border-radius:4px;padding:1px 6px}
  .sb{height:26px;display:flex;align-items:center;gap:16px;padding:0 12px;font-size:11px}
  .sb .r{margin-inline-start:auto;display:flex;gap:14px}
  .mono{font-family:"IBM Plex Mono",Consolas,monospace}
  .note{font-size:11px;color:#5c7086;margin-top:6px}
</style>
</head>
<body>
<div class="pgh">זנטרו · Builder — Design Exploration <span style="font-size:12px;color:#5c7086">(Phase 0.5 · 5 קונספטים High‑Fidelity)</span></div>
<p class="pgs">אותה מערכת מים‑חמים מצוירת ב‑5 שפות עיצוביות. המטרה: ללמוד מהטובים, ולגבש זהות ייחודית לזנטרו. לא העתקה — השראה.</p>
<div id="root"></div>

<script>
const SYS = (t) => {
  // theme: {eq, eqFill, hot, cold, recirc, glow, val, sel, portFill, labelColor}
  const ah = (id,c)=>`<marker id="${id}" markerWidth="9" markerHeight="9" refX="5" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="${c}"/></marker>`;
  const port=(x,y,c)=>`<rect x="${x-4}" y="${y-4}" width="8" height="8" fill="${t.portFill||c}" stroke="${t.eqStroke}" stroke-width="0.8"/>`;
  const glow = t.glow ? `filter="url(#glow)"` : '';
  const pw = t.pipeW||5;
  const lbl=(x,y,s)=>`<text x="${x}" y="${y}" text-anchor="middle" fill="${t.labelColor}" font-size="11" font-family="${t.font}">${s}</text>`;
  const val = t.val ? (x,y,s,c)=>`<g><rect x="${x-16}" y="${y-9}" width="32" height="16" rx="3" fill="${t.valBg}" stroke="${c}" stroke-width="0.8"/><text x="${x}" y="${y+3}" text-anchor="middle" fill="${c}" font-size="9" font-weight="700" font-family="${t.font}">${s}</text></g>` : ()=> '';
  return `
  <svg width="100%" height="100%" viewBox="0 0 720 430" preserveAspectRatio="xMidYMid meet">
   <defs>
    ${ah('h'+t.id,t.hot)}${ah('c'+t.id,t.cold)}${ah('r'+t.id,t.recirc)}
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="g${t.id}" width="20" height="20" patternUnits="userSpaceOnUse">${t.gridDot?`<circle cx="1" cy="1" r="1" fill="${t.grid}"/>`:`<path d="M20 0H0V20" fill="none" stroke="${t.grid}" stroke-width="1"/>`}</pattern>
    <pattern id="G${t.id}" width="100" height="100" patternUnits="userSpaceOnUse"><rect width="100" height="100" fill="url(#g${t.id})"/><path d="M100 0H0V100" fill="none" stroke="${t.gridMajor}" stroke-width="1.1"/></pattern>
   </defs>
   <rect width="720" height="430" fill="${t.canvas}"/>
   ${t.showGrid?`<rect width="720" height="430" fill="url(#G${t.id})"/>`:''}

   <!-- pipes (orthogonal) -->
   <polyline points="200,170 240,170 240,210 300,210" fill="none" stroke="${t.hot}" stroke-width="${pw}" stroke-linejoin="round" marker-mid="url(#h${t.id})" ${glow}/>
   <polyline points="345,150 345,110 470,110 470,180" fill="none" stroke="${t.hot}" stroke-width="${pw}" stroke-linejoin="round" marker-mid="url(#h${t.id})" ${glow}/>
   <polyline points="505,200 545,200 545,250" fill="none" stroke="${t.hot}" stroke-width="${pw}" stroke-linejoin="round" marker-mid="url(#h${t.id})" ${glow}/>
   <polyline points="300,330 330,330 330,300 345,300" fill="none" stroke="${t.cold}" stroke-width="${pw-0.5}" stroke-linejoin="round" marker-mid="url(#c${t.id})" ${glow}/>
   <polyline points="430,320 405,320 405,265 380,265" fill="none" stroke="${t.recirc}" stroke-width="${pw-0.5}" stroke-linejoin="round" marker-mid="url(#r${t.id})" ${glow}/>

   <!-- heat pump -->
   <g><rect x="120" y="135" width="80" height="70" rx="3" fill="${t.eqFill}" stroke="${t.eqStroke}" stroke-width="1.4"/>
      <circle cx="160" cy="170" r="17" fill="none" stroke="${t.eqStroke}" stroke-width="1.3"/>
      <path d="M160 156c7 5 7 23 0 28M160 156c-7 5-7 23 0 28" stroke="${t.eqStroke}" stroke-width="1.1" fill="none"/>
      ${port(200,170,t.hot)}${lbl(160,220,'משאבת חום')}${val(160,128,t.v1||'',t.hot)}</g>
   <!-- tank -->
   <g><ellipse cx="345" cy="150" rx="28" ry="7" fill="${t.eqFill2||t.eqFill}" stroke="${t.eqStroke}" stroke-width="1.4"/>
      <rect x="317" y="150" width="56" height="100" fill="${t.eqFill}" stroke="${t.eqStroke}" stroke-width="1.4"/>
      <rect x="317" y="215" width="56" height="35" fill="${t.hot}" opacity="${t.fillOpacity||0.22}"/>
      <ellipse cx="345" cy="250" rx="28" ry="7" fill="${t.eqFill}" stroke="${t.eqStroke}" stroke-width="1.4"/>
      ${port(317,210,t.hot)}${port(345,150,t.hot)}${port(345,250,t.cold)}${port(378,265,t.recirc)}
      ${lbl(345,272,'מיכל אחסון')}${val(345,195,t.v2||'',t.hot)}</g>
   <!-- mixing valve -->
   <g><path d="M470 180 L500 200 L470 220 Z M530 180 L500 200 L530 220 Z" fill="${t.eqFill}" stroke="${t.eqStroke}" stroke-width="1.4"/>
      ${port(470,180,t.hot)}${port(505,200,t.hot)}${lbl(500,236,'שסתום ערבוב')}</g>
   <!-- shower -->
   <g><rect x="523" y="250" width="44" height="40" rx="5" fill="${t.eqFill}" stroke="${t.eqStroke}" stroke-width="1.4"/>
      <path d="M545 258v7M539 272h12M542 278h6" stroke="${t.eqStroke}" stroke-width="1.2"/>
      ${port(523,250,t.hot)}${lbl(545,304,'מקלחת')}${val(545,244,t.v3||'',t.hot)}</g>
   <!-- recirc pump -->
   <g><circle cx="450" cy="320" r="20" fill="${t.eqFill}" stroke="${t.eqStroke}" stroke-width="1.4"/>
      <path d="M450 305c8 6 8 24 0 30M450 305c-8 6-8 24 0 30" stroke="${t.eqStroke}" stroke-width="1.1" fill="none"/>
      ${port(430,320,t.recirc)}${lbl(450,358,'סירקולציה')}</g>

   <!-- selection on tank -->
   <rect x="310" y="142" width="70" height="116" rx="6" fill="none" stroke="${t.sel}" stroke-width="1.6" ${t.selDash?'stroke-dasharray="5 3"':''}/>
   ${t.grips?[ [310,142],[380,142],[310,258],[380,258] ].map(p=>`<rect x="${p[0]-3}" y="${p[1]-3}" width="6" height="6" fill="${t.canvas}" stroke="${t.sel}" stroke-width="1.4"/>`).join(''):''}
  </svg>`;
};

const card = (t,nm)=>`<div class="lc" style="background:${t.libCard};border:1px solid ${t.border};color:${t.text}">
  <svg width="40" height="30" viewBox="0 0 40 30"><rect x="4" y="4" width="32" height="22" rx="2" fill="none" stroke="${t.accent}" stroke-width="1.4"/></svg>${nm}</div>`;

function frame(t){
  const dir = t.rtl ? 'rtl':'ltr';
  return `
  <div class="concept">
    <div class="clabel"><span class="k">${t.key}</span><span class="insp">${t.inspBy}</span>
      <span class="swatches"><i style="background:${t.bg}"></i><i style="background:${t.panel}"></i><i style="background:${t.accent}"></i><i style="background:${t.hot}"></i><i style="background:${t.cold}"></i><i style="background:${t.sel}"></i></span>
    </div>
    <div class="ws" dir="${dir}" style="background:${t.bg};font-family:${t.font};color:${t.text}">
      <div class="tb" style="background:${t.crust};border-bottom:1px solid ${t.border};color:${t.tbText||t.textSub}">
        <div class="g"><span class="b on" style="background:${t.accentSoft};color:${t.accent}">בנייה</span><span class="b">ניטור</span></div>
        <div class="sep" style="background:${t.border}"></div>
        <div class="g">${['חדש','שמור','ייצוא','ייבוא'].map(x=>`<span class="b">${x}</span>`).join('')}</div>
        <div class="sep" style="background:${t.border}"></div>
        <div class="g">${['↶ בטל','↷ חזור','⧉ שכפל','🗑 מחק'].map(x=>`<span class="b">${x}</span>`).join('')}</div>
        <div class="sep" style="background:${t.border}"></div>
        <div class="g">${['סדר אוטומטית','התאם','100%','⊞ רשת'].map((x,i)=>`<span class="b ${i==3?'on':''}" style="${i==3?'color:'+t.accent:''}">${x}</span>`).join('')}</div>
        <div class="ttl" style="color:${t.text}">${t.brand}</div>
      </div>
      <div class="row">
        <div class="pane" style="background:${t.panel};border-inline-end:1px solid ${t.border}">
          <div class="ph" style="border-bottom:1px solid ${t.border};color:${t.textSub}">ספריית רכיבים</div>
          <div class="pp">
            <div class="srch" style="background:${t.input};border:1px solid ${t.border};color:${t.textSub}">🔍 חפש רכיב…</div>
            <div class="cats">${['מקורות','אגירה','משאבות','שסתומים'].map((c,i)=>`<span style="${i==0?'background:'+t.accentSoft+';color:'+t.accent:'border:1px solid '+t.border+';color:'+t.textSub}">${c}</span>`).join('')}</div>
            <div class="libcards">${card(t,'משאבת חום')}${card(t,'מיכל אחסון')}${card(t,'תנור גז')}${card(t,'מקלחת')}</div>
          </div>
        </div>
        <div class="canvas" style="background:${t.canvas}">
          ${SYS(t)}
          <div class="zc" style="background:${t.panel};border:1px solid ${t.border};color:${t.textSub}"><b>+</b><b>⤢</b><b>−</b></div>
        </div>
        <div class="pane insp" style="background:${t.panel};border-inline-start:1px solid ${t.border}">
          <div class="ph" style="border-bottom:1px solid ${t.border};color:${t.textSub}">מאפיינים</div>
          <div class="hero" style="border-bottom:1px solid ${t.border}">
            <svg width="40" height="46" viewBox="0 0 40 46"><ellipse cx="20" cy="8" rx="15" ry="5" fill="none" stroke="${t.cold}" stroke-width="1.4"/><rect x="5" y="8" width="30" height="30" fill="none" stroke="${t.cold}" stroke-width="1.4"/><rect x="5" y="26" width="30" height="12" fill="${t.hot}" opacity=".25"/></svg>
            <div class="nm">מיכל אחסון 1</div>
            <div class="ty" style="color:${t.accent}">מיכל אחסון</div>
            <div class="acts"><button style="color:${t.accent};border-color:${t.accent}">⧉ שכפל</button><button style="color:${t.danger};border-color:${t.danger}">🗑 מחק</button></div>
          </div>
          <div class="sec" style="border-bottom:1px solid ${t.border}">
            <div style="font-size:10px;font-weight:800;color:${t.textSub};margin-bottom:8px">חיבורים</div>
            <div class="pr" style="border:1px solid ${t.border}"><i style="background:${t.hot}"></i>יציאה חמה<span class="pl" style="background:${t.accentSoft};color:${t.hot}">מים חמים</span></div>
            <div class="pr" style="border:1px solid ${t.border}"><i style="background:${t.cold}"></i>כניסה קרה<span class="pl" style="background:${t.accentSoft};color:${t.cold}">מים קרים</span></div>
          </div>
        </div>
      </div>
      <div class="sb" style="background:${t.crust};border-top:1px solid ${t.border};color:${t.textSub}">
        <span>● מוכנות: 2 אזהרות</span><span>נבחרו: 1</span>
        <span class="r"><span class="mono">זום 100%</span><span class="mono">X:345 Y:150</span><span>נשמר ✓</span></span>
      </div>
    </div>
    <div class="note">${t.note}</div>
  </div>`;
}

const C = [
 { id:'A', key:'Concept A — Revit', inspBy:'בהשראת Autodesk Revit', rtl:true,
   bg:'#eef1f5', panel:'#ffffff', crust:'#e7ebf0', input:'#f3f5f8', border:'#cdd6e0',
   text:'#1f2733', textSub:'#5a6b7e', accent:'#1668d6', accentSoft:'rgba(22,104,214,.12)',
   danger:'#c0392b', canvas:'#f8fafc', grid:'#e2e8f0', gridMajor:'#cdd9e6', showGrid:true,
   eqFill:'#ffffff', eqStroke:'#33485f', hot:'#e8702a', cold:'#2f7fd1', recirc:'#1aa39a',
   sel:'#1668d6', grips:true, font:'"Segoe UI",Arial,sans-serif', labelColor:'#46566a',
   pipeW:5, brand:'זנטרו',
   note:'בהיר, מדויק, "BIM": רקע בהיר, כחול Revit, ידיות בחירה (grips), קווים דקים. מקצועי ושקט — אך בהיר מאוד למרכז‑שליטה.' },

 { id:'B', key:'Concept B — AutoCAD Plant 3D', inspBy:'בהשראת AutoCAD Plant 3D', rtl:false,
   bg:'#2b2b2b', panel:'#333337', crust:'#252528', input:'#1f1f22', border:'#45454c',
   text:'#e8e8e8', textSub:'#a9a9b2', accent:'#d24b4b', accentSoft:'rgba(210,75,75,.16)',
   danger:'#e05a5a', canvas:'#141414', grid:'#262626', gridMajor:'#333', showGrid:true, gridDot:true,
   eqFill:'#141414', eqStroke:'#e6e6e6', hot:'#ff6a2b', cold:'#2ec5ff', recirc:'#37e0b0',
   sel:'#3aa0ff', selDash:true, grips:true, font:'"Consolas","Segoe UI",monospace', labelColor:'#cfcfcf',
   pipeW:4.5, brand:'ZENTRO · MODEL',
   note:'"Model space" שחור, סמלי ACI לבנים/צבעוניים, רשת נקודות, בחירה מקווקוות עם grips. מאוד CAD/הנדסי — אך קשוח וכבד לטכנאי.' },

 { id:'C', key:'Concept C — Siemens TIA Portal', inspBy:'בהשראת Siemens TIA Portal', rtl:true,
   bg:'#dfe3e6', panel:'#f4f6f7', crust:'#3a4750', input:'#ffffff', border:'#b9c2c9',
   text:'#23303a', textSub:'#5c6b76', accent:'#13868a', accentSoft:'rgba(19,134,138,.13)',
   danger:'#c0392b', canvas:'#ffffff', grid:'#e6eaed', gridMajor:'#d2d9de', showGrid:true,
   eqFill:'#ffffff', eqStroke:'#2c3e50', hot:'#e2722a', cold:'#2e86c1', recirc:'#16a085',
   sel:'#ef8a2b', grips:true, font:'"Segoe UI",Arial,sans-serif', labelColor:'#42525e', tbText:'#e8eef2',
   pipeW:5, brand:'זנטרו · Portal',
   note:'תאגידי, petrol טורקיז סימנס + בחירה כתומה, פאנלים מובנים, toolbar כהה על אזור‑עבודה בהיר. מסודר מאוד — אך "כבד" ופחות מודרני.' },

 { id:'D', key:'Concept D — Ignition / SCADA', inspBy:'בהשראת Inductive Ignition / SCADA HMI', rtl:true,
   bg:'#0c1117', panel:'#141d27', crust:'#0a0f15', input:'#0e1620', border:'#22303f',
   text:'#e2edf7', textSub:'#8fa3b8', accent:'#00c2de', accentSoft:'rgba(0,194,222,.14)',
   danger:'#ef4655', canvas:'#080c11', grid:'#141d27', gridMajor:'#1d2a38', showGrid:true,
   eqFill:'#0f1923', eqStroke:'#5fd0e6', hot:'#ff7a33', cold:'#36c6ff', recirc:'#2fe0c0',
   sel:'#00e5ff', glow:true, font:'"Roboto","Segoe UI",sans-serif', labelColor:'#9fb3c6',
   val:true, valBg:'#0b141d', v1:'58°', v2:'54°', v3:'41°', pipeW:6, brand:'ZENTRO HMI',
   note:'HMI תפעולי: ערכים חיים על הציוד, צינורות זוהרים, ניגודיות גבוהה, ציאן. מצוין ל‑Monitor — אך יותר מדי "אנימציה/זוהר" לעורך תכן.' },

 { id:'E', key:'Concept E — Zentro Original ★', inspBy:'הסינתזה — זהות זנטרו', rtl:true,
   bg:'#0b0f14', panel:'#121821', crust:'#0e131a', input:'#161d27', border:'#1e2a38',
   text:'#e6edf6', textSub:'#9fb0c3', accent:'#4f9cf9', accentSoft:'rgba(79,156,249,.14)',
   danger:'#ef4444', canvas:'#0a0e13', grid:'#16202c', gridMajor:'#22303f', showGrid:true,
   eqFill:'#0f1722', eqFill2:'#13202c', eqStroke:'#5b7da0', hot:'#f97316', cold:'#38bdf8', recirc:'#2dd4bf',
   sel:'#4f9cf9', grips:true, font:'"Heebo","Assistant",system-ui,sans-serif', labelColor:'#9fb0c3',
   pipeW:5, brand:'זנטרו · תאום דיגיטלי',
   note:'★ מומלץ: כהה‑רגוע, accent כחול אחד (נפרד מצבעי המדיום), קווי P&ID דקים, פורטים מרובעים צמודים, RTL עברית, ידיות בחירה עדינות. שקט במנוחה, פרימיום, וסקלאבילי לכל הדומיינים.' },
];

document.getElementById('root').innerHTML = C.map(frame).join('');
</script>
</body>
</html>
